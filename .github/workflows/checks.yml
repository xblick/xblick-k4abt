# Checks that need neither the Azure Kinect SDKs nor a GPU. Building the tracker and its test needs Durchblick's
# C++ package, the Sensor SDK, the Body Tracking SDK, ONNX Runtime and a CUDA toolkit: see docs/build.md.
name: checks

on:
  push:
  pull_request:

jobs:
  references:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reference check (tools/check_references.sh)
        run: tools/check_references.sh
